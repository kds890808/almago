<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>이번주 경주 | ALMAGO</title>

<style>

/* ==========================================
   기본 설정
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --green-900:#14532d;
    --green-800:#166534;
    --green-700:#1d4ed8;
    --green-600:#16a34a;
    --green-500:#22c55e;
    --green-100:#dcfce7;
    --green-50:#f0fdf4;

    --blue-600:#2563eb;
    --blue-700:#1d4ed8;
    --blue-50:#eff6ff;

    --red-500:#ef4444;

    --gray-900:#111827;
    --gray-800:#1f2937;
    --gray-700:#374151;
    --gray-600:#4b5563;
    --gray-500:#6b7280;
    --gray-400:#9ca3af;
    --gray-300:#d1d5db;
    --gray-200:#e5e7eb;
    --gray-100:#f3f4f6;
    --gray-50:#f9fafb;

    --shadow:
        0 8px 24px
        rgba(15,23,42,0.07);
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f7faf8 0%,
            #f2f5f4 100%
        );

    color:var(--gray-900);

    min-height:100vh;
}

button{
    font-family:inherit;
}

.page{

    width:100%;
    max-width:700px;

    margin:0 auto;

    min-height:100vh;

    background:#fff;

    box-shadow:
        0 0 30px
        rgba(15,23,42,0.07);
}


/* ==========================================
   상단 헤더
========================================== */

.top-header{

    position:sticky;

    top:0;
    z-index:100;

    display:grid;

    grid-template-columns:
        46px
        minmax(0,1fr)
        46px;

    align-items:center;

    min-height:72px;

    padding:10px 16px;

    background:
        rgba(255,255,255,0.94);

    border-bottom:
        1px solid
        rgba(229,231,235,0.9);

    backdrop-filter:
        blur(12px);
}

.header-icon-btn{

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:50%;

    background:transparent;

    color:var(--blue-700);

    font-size:27px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.header-icon-btn:hover{

    background:var(--blue-50);

    transform:
        translateY(-1px);
}

.header-title{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    min-width:0;

    font-size:28px;
    font-weight:1000;

    letter-spacing:-1px;

    white-space:nowrap;
}

.header-title-icon{
    font-size:30px;
}


/* ==========================================
   소개 영역
========================================== */

.intro-section{

    padding:
        28px 20px
        18px;

    text-align:center;
}

.intro-label{

    color:var(--blue-700);

    font-size:13px;
    font-weight:900;

    letter-spacing:1px;
}

.intro-title{

    margin-top:6px;

    color:var(--gray-900);

    font-size:27px;
    font-weight:1000;

    line-height:1.35;

    letter-spacing:-1px;
}

.intro-description{

    margin-top:10px;

    color:var(--gray-600);

    font-size:16px;
    font-weight:650;

    line-height:1.7;
}


/* ==========================================
   이번 주 요약
========================================== */

.summary-wrap{
    padding:0 18px;
}

.summary-card{

    display:grid;

    grid-template-columns:
        1.5fr
        repeat(3,1fr);

    align-items:center;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #f7fbff 0%,
            #eef6ff 100%
        );

    border:
        1px solid
        #bfd8ff;

    border-radius:20px;

    box-shadow:
        0 7px 22px
        rgba(37,99,235,0.08);
}

.summary-total{

    display:flex;

    align-items:center;

    gap:13px;

    padding:22px 18px;
}

.summary-icon{

    flex-shrink:0;

    width:52px;
    height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #dff8e7,
            #effdf3
        );

    color:var(--blue-700);

    font-size:25px;
}

.summary-label{

    color:var(--gray-700);

    font-size:14px;
    font-weight:800;
}

.summary-number{

    margin-top:1px;

    color:var(--blue-700);

    font-size:31px;
    font-weight:1000;

    line-height:1.2;
}

.summary-number small{

    color:var(--gray-600);

    font-size:14px;
    font-weight:800;
}

.summary-region{

    min-height:77px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    border-left:
        1px solid
        rgba(209,213,219,0.7);
}

.summary-region-name{

    color:var(--gray-700);

    font-size:14px;
    font-weight:800;
}

.summary-region-count{

    margin-top:4px;

    color:var(--blue-700);

    font-size:24px;
    font-weight:1000;
}

.summary-region-count small{

    color:var(--gray-600);

    font-size:12px;
    font-weight:750;
}


/* ==========================================
   날짜 선택
========================================== */

.date-section{

    padding:
        24px 18px
        0;
}

.date-tabs{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:10px;
}

.date-tab{

    position:relative;

    min-width:0;

    padding:
        15px 6px
        14px;

    border:
        1px solid
        var(--gray-200);

    border-radius:15px;

    background:#fff;

    color:var(--gray-800);

    cursor:pointer;

    box-shadow:
        0 5px 14px
        rgba(15,23,42,0.06);

    transition:
        transform .18s,
        background .18s,
        border-color .18s,
        box-shadow .18s;
}

.date-tab:hover{

    transform:
        translateY(-2px);

    border-color:
        #93c5fd;
}

.date-tab.active{

    border-color:
        var(--blue-600);

    background:
        linear-gradient(
            145deg,
            #2563eb 0%,
            #1d4ed8 100%
        );

    color:#fff;

    box-shadow:
        0 7px 18px
        rgba(37,99,235,0.25);
}

.date-day{

    display:block;

    font-size:18px;
    font-weight:1000;

    line-height:1.3;
}

.date-value{

    display:block;

    margin-top:5px;

    font-size:15px;
    font-weight:750;
}

.today-mark{

    display:inline-block;

    margin-left:3px;

    font-size:11px;
    font-weight:900;
}


/* ==========================================
   지역 필터
========================================== */

.region-filter-wrap{

    padding:
        20px 18px
        0;
}

.region-filter{

    display:flex;

    gap:9px;

    overflow-x:auto;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.region-filter::-webkit-scrollbar{
    display:none;
}

.region-btn{

    flex:0 0 auto;

    min-width:75px;

    padding:
        10px 20px;

    border:
        1px solid
        var(--gray-200);

    border-radius:999px;

    background:#fff;

    color:var(--gray-700);

    font-size:15px;
    font-weight:850;

    cursor:pointer;

    transition:.18s;
}

.region-btn:hover{

    border-color:
        #93c5fd;

    background:
        var(--blue-50);
}

.region-btn.active{

    border-color:
        var(--blue-700);

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color:#fff;

    box-shadow:
        0 4px 12px
        rgba(37,99,235,0.2);
}


/* ==========================================
   선택 날짜 정보
========================================== */

.schedule-section{

    padding:
        22px 18px
        38px;
}

.schedule-heading{

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding-bottom:14px;

    border-bottom:
        1px solid
        var(--gray-200);
}

.schedule-heading-left{

    display:flex;

    align-items:center;

    gap:9px;

    min-width:0;
}

.schedule-heading-icon{

    width:35px;
    height:35px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    border-radius:10px;

    background:
        var(--blue-50);

    color:
        var(--blue-700);

    font-size:19px;
}

.schedule-date-title{

    font-size:22px;
    font-weight:1000;

    letter-spacing:-.7px;

    white-space:nowrap;
}

.schedule-total{

    flex-shrink:0;

    color:var(--gray-600);

    font-size:14px;
    font-weight:800;
}


/* ==========================================
   지역별 경주
========================================== */

.region-group{

    margin-top:18px;

    padding:
        15px 14px
        14px;

    background:
        linear-gradient(
            180deg,
            #fbfdfc 0%,
            #f8fbf9 100%
        );

    border:
        1px solid
        #edf1ef;

    border-radius:18px;
}

.region-group.hidden{
    display:none;
}

.region-heading{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;
}

.region-name-wrap{

    display:flex;

    align-items:center;

    gap:8px;
}

.region-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:
        var(--blue-600);

    box-shadow:
        0 0 0 5px
        rgba(37,99,235,0.09);
}

.region-name{

    color:
        var(--gray-900);

    font-size:20px;
    font-weight:1000;
}

.region-race-count{

    padding:
        5px 11px;

    border:
        1px solid
        #bfd8ff;

    border-radius:999px;

    background:
        #eff6ff;

    color:
        var(--blue-700);

    font-size:13px;
    font-weight:900;
}


/* ==========================================
   가로 경주 카드
========================================== */

.race-scroll-area{

    position:relative;
}

.race-card-list{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:
        2px 2px
        10px;

    scroll-snap-type:
        x mandatory;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.race-card-list::-webkit-scrollbar{
    display:none;
}

.race-card{

    flex:
        0 0
        190px;

    scroll-snap-align:start;

    display:flex;

    flex-direction:column;

    min-height:252px;

    padding:
        17px 13px
        14px;

    background:#fff;

    border:
        1px solid
        var(--gray-200);

    border-radius:17px;

    box-shadow:
        0 5px 15px
        rgba(15,23,42,0.055);
}

.race-card-top{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;
}

.race-number{

    color:
        var(--blue-700);

    font-size:25px;
    font-weight:1000;

    white-space:nowrap;
}

.race-grade{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:29px;

    padding:
        3px 9px;

    border-radius:999px;

    background:
        var(--gray-100);

    color:
        var(--gray-700);

    font-size:13px;
    font-weight:850;

    white-space:nowrap;
}

.race-info{

    margin-top:14px;

    text-align:center;
}

.race-distance{

    color:
        var(--gray-800);

    font-size:17px;
    font-weight:800;
}

.race-horses{

    margin-top:5px;

    color:
        var(--gray-700);

    font-size:15px;
    font-weight:750;
}

.race-time{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    margin-top:17px;

    color:
        var(--red-500);

    font-size:19px;
    font-weight:1000;
}

.race-time-icon{

    color:
        var(--gray-700);

    font-size:16px;
}

.race-status{

    min-height:19px;

    margin-top:5px;

    text-align:center;

    color:
        var(--blue-700);

    font-size:12px;
    font-weight:850;
}

.race-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:auto;
    padding-top:15px;
}

.race-action-btn{

    min-width:0;

    height:40px;

    border-radius:10px;

    font-size:13px;
    font-weight:900;

    cursor:pointer;

    white-space:nowrap;

    transition:.17s;
}

.detail-btn{

    border:
        1px solid
        var(--blue-700);

    background:#fff;

    color:
        var(--blue-700);
}

.detail-btn:hover{

    background:
        var(--blue-50);

    transform:
        translateY(-1px);
}

.analysis-btn{

    border:
        1px solid
        var(--blue-700);

    background:
        linear-gradient(
            145deg,
            #2563eb,
            #1d4ed8
        );

    color:#fff;
}

.analysis-btn:hover{

    filter:
        brightness(1.06);

    transform:
        translateY(-1px);
}


/* ==========================================
   좌우 스크롤 안내
========================================== */

.scroll-guide{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding-top:4px;

    color:
        var(--gray-500);

    font-size:12px;
    font-weight:700;
}

.scroll-guide span{

    color:
        var(--blue-700);

    font-size:17px;
    font-weight:1000;
}


/* ==========================================
   안내 문구
========================================== */

.notice{

    padding:
        0 20px
        38px;

    text-align:center;

    color:
        var(--gray-500);

    font-size:13px;
    font-weight:650;

    line-height:1.7;
}


/* ==========================================
   빈 데이터
========================================== */

.empty-box{

    display:none;

    margin-top:18px;

    padding:
        42px 20px;

    text-align:center;

    border:
        1px dashed
        var(--gray-300);

    border-radius:17px;

    background:
        var(--gray-50);
}

.empty-icon{
    font-size:35px;
}

.empty-title{

    margin-top:8px;

    font-size:18px;
    font-weight:900;
}

.empty-text{

    margin-top:5px;

    color:
        var(--gray-500);

    font-size:14px;
    font-weight:650;
}


/* ==========================================
   500px 이하 모바일
========================================== */

@media(max-width:500px){

    .page{
        max-width:100%;
    }

    .top-header{

        min-height:62px;

        padding:
            8px 12px;

        grid-template-columns:
            42px
            minmax(0,1fr)
            42px;
    }

    .header-icon-btn{

        width:38px;
        height:38px;

        font-size:24px;
    }

    .header-title{

        font-size:23px;

        letter-spacing:-.8px;
    }

    .header-title-icon{
        font-size:25px;
    }

    .intro-section{

        padding:
            24px 15px
            16px;
    }

    .intro-title{
        font-size:23px;
    }

    .intro-description{

        font-size:15px;

        word-break:keep-all;
    }

    .summary-wrap{
        padding:0 12px;
    }

    .summary-card{

        grid-template-columns:
            1.45fr
            repeat(3,.8fr);

        border-radius:16px;
    }

    .summary-total{

        gap:8px;

        padding:
            17px 10px;
    }

    .summary-icon{

        width:40px;
        height:40px;

        font-size:20px;
    }

    .summary-label{
        font-size:11px;
    }

    .summary-number{
        font-size:25px;
    }

    .summary-number small{
        font-size:11px;
    }

    .summary-region{

        min-height:65px;

        padding:
            5px 2px;
    }

    .summary-region-name{
        font-size:11px;
    }

    .summary-region-count{
        font-size:20px;
    }

    .summary-region-count small{
        font-size:10px;
    }

    .date-section{

        padding:
            19px 12px
            0;
    }

    .date-tabs{
        gap:7px;
    }

    .date-tab{

        padding:
            13px 3px
            12px;

        border-radius:13px;
    }

    .date-day{
        font-size:16px;
    }

    .date-value{
        font-size:13px;
    }

    .today-mark{
        font-size:9px;
    }

    .region-filter-wrap{

        padding:
            17px 12px
            0;
    }

    .region-filter{
        gap:7px;
    }

    .region-btn{

        min-width:67px;

        padding:
            9px 17px;

        font-size:14px;
    }

    .schedule-section{

        padding:
            19px 12px
            30px;
    }

    .schedule-heading-icon{

        width:32px;
        height:32px;

        font-size:17px;
    }

    .schedule-date-title{
        font-size:19px;
    }

    .schedule-total{
        font-size:12px;
    }

    .region-group{

        margin-top:15px;

        padding:
            13px 10px
            11px;

        border-radius:15px;
    }

    .region-name{
        font-size:18px;
    }

    .region-race-count{
        font-size:12px;
    }

    .race-card{

        flex-basis:172px;

        min-height:238px;

        padding:
            15px 10px
            12px;

        border-radius:15px;
    }

    .race-number{
        font-size:22px;
    }

    .race-grade{

        min-height:27px;

        font-size:12px;
    }

    .race-distance{
        font-size:16px;
    }

    .race-horses{
        font-size:14px;
    }

    .race-time{

        margin-top:14px;

        font-size:18px;
    }

    .race-action-btn{

        height:38px;

        font-size:12px;
    }

    .notice{

        padding:
            0 15px
            30px;

        font-size:12px;
    }

}


/* ==========================================
   360px 이하 소형 화면
========================================== */

@media(max-width:360px){

    .header-title{
        font-size:21px;
    }

    .summary-icon{
        display:none;
    }

    .summary-total{

        justify-content:center;

        padding:
            15px 4px;
    }

    .summary-label{
        font-size:10px;
    }

    .summary-number{
        font-size:23px;
    }

    .date-day{
        font-size:15px;
    }

    .date-value{
        font-size:12px;
    }

    .race-card{
        flex-basis:163px;
    }

}

/* ==========================================
   상세보기 모달
========================================== */

.modal{

    display:none;

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    padding:15px;

    background:rgba(0,0,0,.5);

    z-index:9999;

    justify-content:center;
    align-items:center;

}

.modal-content{

    width:100%;
    max-width:900px;
    max-height:85vh;

    overflow:auto;

    background:#fff;

    border-radius:20px;

    padding:20px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}

.close-btn{

    width:40px;
    height:40px;

    border:none;

    border-radius:50%;

    background:#ef4444;

    color:#fff;

    font-size:18px;

    cursor:pointer;

}

.race-scroll-wrap{

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

}

@media(max-width:500px){

    .modal{

        padding:8px;

    }

    .modal-content{

        max-width:100%;

        border-radius:14px;

        padding:12px;

    }

}

/* 클릭 가능한 글씨 안내 */
.click-info-guide{
    margin:10px 0 14px;
    padding:10px 14px;

    background:#fff7dc;
    border:1px solid #f5c451;
    border-radius:10px;

    color:#59430b;

    font-size:15px;
    font-weight:600;
    text-align:center;
}

.basic-scroll-guide{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:8px 0 4px;
    font-size:13px;
    color:#64748b;
    white-space:nowrap;
}

.basic-scroll-guide span{
    font-size:22px;
    font-weight:900;
    color:#2563eb;
}

.basic-scroll-guide b{
    font-size:13px;
    font-weight:700;
}
</style>

</head>


<body>

<div class="page">


    <!-- =====================================
         상단 헤더
    ====================================== -->

    <header class="top-header">

        <button
            type="button"
            class="header-icon-btn"
            onclick="history.back()"
            aria-label="뒤로가기"
        >
            ‹
        </button>


        <div class="header-title">

            <span class="header-title-icon">
                🐎

<script src="/js/race-detail.js"></script>

<script>

/* ==========================================
   현재 선택값
========================================== */

let weeklyData = {};

let selectedDate = "";

let selectedRegion = "전체";


/* ==========================================
   날짜 정규화
========================================== */

function normalizeDate(value){

    return String(value || "")
        .replace(/[^0-9]/g, "")
        .slice(0, 8);

}


/* ==========================================
   날짜 표시용 정보
========================================== */

function getDateInfo(dateValue){

    const normalized =
        normalizeDate(dateValue);

    if(normalized.length !== 8){

        return {
            weekday: "",
            shortDate: "",
            title: dateValue
        };

    }

    const year =
        Number(normalized.slice(0, 4));

    const month =
        Number(normalized.slice(4, 6));

    const day =
        Number(normalized.slice(6, 8));

    const date =
        new Date(year, month - 1, day);

    const weekdays = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];

    const weekday =
        weekdays[date.getDay()];

    const shortDate =
        `${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}`;

    return {
        weekday,
        shortDate,
        title: `${weekday} (${shortDate})`
    };

}


/* ==========================================
   오늘 날짜
========================================== */

function getTodayValue(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(now.getDate())
            .padStart(2, "0");

    return `${year}${month}${day}`;

}

function updatePageTitle(){

    const today = new Date();

    // 월=0 화=1 수=2
    const isLastWeek =
        today.getDay() >= 1 &&
        today.getDay() <= 3;

    if(isLastWeek){

        document.getElementById("page-title").textContent =
            "지난주 경주";

        document.getElementById("intro-title").textContent =
            "지난주 경주를 한눈에 확인하세요";

        document.getElementById("summary-label").textContent =
            "지난주 총 경주수";

    }else{

        document.getElementById("page-title").textContent =
            "이번주 경주";

        document.getElementById("intro-title").textContent =
            "이번 주 경주를 한눈에 확인하세요";

        document.getElementById("summary-label").textContent =
            "이번 주 총 경주수";

    }

}

/* ==========================================
   HTML 문자 안전 처리
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ==========================================
   거리 표시
========================================== */

function formatDistance(value){

    const text =
        String(value ?? "").trim();

    if(!text){
        return "-";
    }

    if(/[mM]$/.test(text)){
        return text.toLowerCase();
    }

    return `${text}m`;

}


/* ==========================================
   출전두수 표시
========================================== */

function formatHorseCount(value){

    const text =
        String(value ?? "").trim();

    if(!text){
        return "-";
    }

    if(text.includes("두")){
        return text;
    }

    return `${text}두`;

}


/* ==========================================
   경주번호 정렬
========================================== */

function sortRaces(races){

    return [...races].sort((a, b)=>{

        return Number(a.race || 0)
            -
            Number(b.race || 0);

    });

}


/* ==========================================
   이번 주 경주 데이터 불러오기
========================================== */

async function loadWeeklyData(){

    const response =
        await fetch(
            "/weekly-race-data",
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

    if(!response.ok){

        throw new Error(
            `경주정보 조회 실패: ${response.status}`
        );

    }

    const data =
        await response.json();

    weeklyData =
        data && typeof data === "object"
        ? data
        : {};

}


/* ==========================================
   날짜 목록
========================================== */

function getSortedDates(){

    return Object.keys(weeklyData)
        .sort((a, b)=>{

            return normalizeDate(a)
                .localeCompare(
                    normalizeDate(b)
                );

        });

}


/* ==========================================
   지역 목록
========================================== */

function getRegionsForDate(dateValue){

    const dateData =
        weeklyData[dateValue];

    if(
        !dateData
        ||
        !dateData.regions
    ){
        return [];
    }

    const preferredOrder = [
        "서울",
        "부산",
        "부산경남",
        "제주"
    ];

    return Object.keys(dateData.regions)
        .sort((a, b)=>{

            const indexA =
                preferredOrder.indexOf(a);

            const indexB =
                preferredOrder.indexOf(b);

            const orderA =
                indexA === -1
                ? 999
                : indexA;

            const orderB =
                indexB === -1
                ? 999
                : indexB;

            return orderA - orderB;

        });

}


/* ==========================================
   부산경남 표시명 정리
========================================== */

function getRegionDisplayName(region){

    if(region === "부산경남"){
        return "부산";
    }

    return region;

}


/* ==========================================
   주간 요약 표시
========================================== */

function renderSummary(){

    let totalCount = 0;

    const regionCount = {
        서울: 0,
        부산: 0,
        제주: 0
    };

    Object.values(weeklyData)
        .forEach(dateData=>{

            const regions =
                dateData?.regions || {};

            Object.entries(regions)
                .forEach(([region, races])=>{

                    const count =
                        Array.isArray(races)
                        ? races.length
                        : 0;

                    totalCount += count;

                    const displayRegion =
                        getRegionDisplayName(region);

                    if(
                        Object.prototype.hasOwnProperty.call(
                            regionCount,
                            displayRegion
                        )
                    ){
                        regionCount[displayRegion] += count;
                    }

                });

        });


    document
        .getElementById("total-race-count")
        .textContent =
        totalCount;


    document
        .getElementById("seoul-race-count")
        .textContent =
        regionCount.서울;


    document
        .getElementById("busan-race-count")
        .textContent =
        regionCount.부산;


    document
        .getElementById("jeju-race-count")
        .textContent =
        regionCount.제주;

}


/* ==========================================
   날짜 버튼 자동 생성
========================================== */

function renderDateTabs(){

    const container =
        document.querySelector(".date-tabs");

    const dates =
        getSortedDates();

    const today =
        getTodayValue();

    container.innerHTML =
        dates.map(dateValue=>{

            const info =
                getDateInfo(dateValue);

            const activeClass =
                dateValue === selectedDate
                ? "active"
                : "";

            const todayMark =
                normalizeDate(dateValue) === today
                ? `
                    <span class="today-mark">
                        오늘
                    </span>
                  `
                : "";

            return `
                <button
                    type="button"
                    class="date-tab ${activeClass}"
                    data-date="${escapeHtml(dateValue)}"
                >

                    <span class="date-day">
                        ${escapeHtml(info.weekday)}
                    </span>

                    <span class="date-value">

                        ${escapeHtml(info.shortDate)}

                        ${todayMark}

                    </span>

                </button>
            `;

        })
        .join("");


    container
        .querySelectorAll(".date-tab")
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>selectDate(button)
            );

        });

}


/* ==========================================
   지역 버튼 자동 생성
========================================== */

function renderRegionButtons(){

    const container =
        document.querySelector(".region-filter");

    const regions =
        getRegionsForDate(selectedDate);

    const allActive =
        selectedRegion === "전체"
        ? "active"
        : "";

    let html = `
        <button
            type="button"
            class="region-btn ${allActive}"
            data-region="전체"
        >
            전체
        </button>
    `;


    html += regions.map(region=>{

        const activeClass =
            selectedRegion === region
            ? "active"
            : "";

        return `
            <button
                type="button"
                class="region-btn ${activeClass}"
                data-region="${escapeHtml(region)}"
            >
                ${escapeHtml(
                    getRegionDisplayName(region)
                )}
            </button>
        `;

    })
    .join("");


    container.innerHTML =
        html;


    container
        .querySelectorAll(".region-btn")
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>selectRegion(button)
            );

        });

}


/* ==========================================
   날짜 선택
========================================== */

function selectDate(button){

    selectedDate =
        button.dataset.date;

    selectedRegion =
        "전체";

    renderDateTabs();

    renderRegionButtons();

    renderSchedule();

}


/* ==========================================
   지역 선택
========================================== */

function selectRegion(button){

    selectedRegion =
        button.dataset.region;

    document
        .querySelectorAll(".region-btn")
        .forEach(btn=>{

            btn.classList.toggle(
                "active",
                btn === button
            );

        });

    renderSchedule();

}


/* ==========================================
   경주 카드 생성
========================================== */

function createRaceCard(
    race,
    region
){

    const raceNo =
        race.race ?? "-";

    const grade =
        race.grade || "-";

    const distance =
        formatDistance(
            race.distance
        );

    const horseCount =
        formatHorseCount(
            race.horse_count
        );

    const startTime =
        race.start_time || "-";

    const cancelCount =
        Number(race.cancel || 0);

    const statusText =
        cancelCount > 0
        ? `취소 ${cancelCount}두`
        : "AI 분석 제공";

    return `
        <article class="race-card">

            <div class="race-card-top">

                <div class="race-number">
                    ${escapeHtml(raceNo)}경주
                </div>

                <div class="race-grade">
                    ${escapeHtml(grade)}
                </div>

            </div>


            <div class="race-info">

                <div class="race-distance">
                    ${escapeHtml(distance)}
                </div>

                <div class="race-horses">
                    🐎 출전 ${escapeHtml(horseCount)}
                </div>

            </div>


            <div class="race-time">

                <span class="race-time-icon">
                    ◷
                </span>

                ${escapeHtml(startTime)}

            </div>


            <div class="race-status">
                ${escapeHtml(statusText)}
            </div>


            <div class="race-actions">

                <button
                    type="button"
                    class="race-action-btn detail-btn"
                    data-action="detail"
                    data-region="${escapeHtml(region)}"
                    data-race="${escapeHtml(raceNo)}"
                >
                    상세보기
                </button>

                <button
                    type="button"
                    class="race-action-btn analysis-btn"
                    data-action="analysis"
                    data-region="${escapeHtml(region)}"
                    data-race="${escapeHtml(raceNo)}"
                >
                    분석보기
                </button>

            </div>

        </article>
    `;

}


/* ==========================================
   지역 그룹 생성
========================================== */

function createRegionGroup(
    region,
    races
){

    const sortedRaces =
        sortRaces(races);

    const cards =
        sortedRaces
            .map(race=>
                createRaceCard(
                    race,
                    region
                )
            )
            .join("");

    return `
        <section
            class="region-group"
            data-region-group="${escapeHtml(region)}"
        >

            <div class="region-heading">

                <div class="region-name-wrap">

                    <span class="region-dot"></span>

                    <h2 class="region-name">
                        ${escapeHtml(
                            getRegionDisplayName(region)
                        )}
                    </h2>

                </div>

                <div class="region-race-count">
                    ${sortedRaces.length}경주
                </div>

            </div>


            <div class="race-scroll-area">

                <div class="race-card-list">
                    ${cards}
                </div>

                ${
                    sortedRaces.length > 1
                    ? `
                        <div class="scroll-guide">

                            <span>←</span>

                            좌우로 밀어서 확인하세요

                            <span>→</span>

                        </div>
                      `
                    : ""
                }

            </div>

        </section>
    `;

}


/* ==========================================
   선택 날짜의 총 경주수
========================================== */

function getSelectedDateRaceCount(){

    const dateData =
        weeklyData[selectedDate];

    if(
        !dateData
        ||
        !dateData.regions
    ){
        return 0;
    }

    return Object.values(dateData.regions)
        .reduce((sum, races)=>{

            return sum +
                (
                    Array.isArray(races)
                    ? races.length
                    : 0
                );

        }, 0);

}


/* ==========================================
   경주 목록 표시
========================================== */

function renderSchedule(){

    const container =
        document.getElementById(
            "schedule-container"
        );

    const emptyBox =
        document.getElementById(
            "empty-box"
        );

    const titleElement =
        document.getElementById(
            "selected-date-title"
        );

    const countElement =
        document.getElementById(
            "selected-date-count"
        );

    const dateData =
        weeklyData[selectedDate];

    const dateInfo =
        getDateInfo(selectedDate);


    titleElement.textContent =
        dateInfo.title || "경주일";


    countElement.textContent =
        `총 ${getSelectedDateRaceCount()}경주`;


    if(
        !dateData
        ||
        !dateData.regions
    ){

        container.innerHTML = "";

        emptyBox.style.display =
            "block";

        return;

    }


    const regions =
        getRegionsForDate(selectedDate)
            .filter(region=>{

                return (
                    selectedRegion === "전체"
                    ||
                    selectedRegion === region
                );

            });


    if(regions.length === 0){

        container.innerHTML = "";

        emptyBox.style.display =
            "block";

        return;

    }


    container.innerHTML =
        regions.map(region=>{

            const races =
                dateData.regions[region] || [];

            return createRegionGroup(
                region,
                races
            );

        })
        .join("");


    emptyBox.style.display =
        "none";


    container
        .querySelectorAll(
            "[data-action='detail']"
        )
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>{

                    showDetail(
                        button.dataset.region,
                        button.dataset.race
                    );

                }
            );

        });


    container
        .querySelectorAll(
            "[data-action='analysis']"
        )
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>{

                    showAnalysis(
                        button.dataset.region,
                        button.dataset.race
                    );

                }
            );

        });

}


/* ==========================================
   상세보기
========================================== */

async function showDetail(region, raceNo){

    await showRaceDetail(
        region === "부산" ? "부산경남" : region,
        raceNo,
        selectedDate
    );

}


/* ==========================================
   분석보기
========================================== */

function showAnalysis(region, raceNo){

    goAI(
        region,
        raceNo,
        selectedDate
    );

}


/* ==========================================
   로딩 실패 표시
========================================== */

function showLoadError(error){

    console.error(
        "이번 주 경주 조회 오류:",
        error
    );

    document
        .getElementById(
            "selected-date-title"
        )
        .textContent =
        "경주정보를 불러오지 못했습니다";


    document
        .getElementById(
            "selected-date-count"
        )
        .textContent =
        "총 0경주";


    document
        .getElementById(
            "schedule-container"
        )
        .innerHTML =
        "";


    const emptyBox =
        document.getElementById(
            "empty-box"
        );

    emptyBox.style.display =
        "block";

    emptyBox
        .querySelector(".empty-title")
        .textContent =
        "경주정보 조회에 실패했습니다";

    emptyBox
        .querySelector(".empty-text")
        .textContent =
        "잠시 후 다시 시도해 주세요.";

}


/* ==========================================
   최초 실행
========================================== */

async function initializeWeeklyRace(){

    try{

        await loadWeeklyData();

        updatePageTitle();

        const dates =
            getSortedDates();

        if(dates.length === 0){

            throw new Error(
                "등록된 경주 데이터가 없습니다."
            );

        }


        const today =
            getTodayValue();


        selectedDate =
            dates.find(dateValue=>
                normalizeDate(dateValue) === today
            )
            ||
            dates[0];


        selectedRegion =
            "전체";


        renderSummary();

        renderDateTabs();

        renderRegionButtons();

        renderSchedule();

    }catch(error){

        showLoadError(error);

    }

}


initializeWeeklyRace();

</script>
