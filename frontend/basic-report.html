<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/basic-report.css">

<title>AI 분석</title>

</head>

<body>

<div class="user-bar">

<div class="user-left">

    <div
    class="home-btn"
    onclick="goHome()"
    >
    🏠
    </div>

    <div
    id="user-name"
    class="user-name"
    onclick="goMyPage()"
    >
    👤 admin님
    </div>

    <div
    id="user-point"
    class="user-point"
    onclick="goPointLog()"
    >
    💰 999999P
    </div>

    <div
    class="charge-btn"
    onclick="goCharge()"
    >
    💳
    </div>

</div>


    <button
    class="logout-top-btn"
    onclick="logout()"
    >
    로그아웃
    </button>

</div>

<h2>AI 분석 결과</h2>

<div id="analysis-area"></div>



<div
id="horse-modal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:9999;
"
>

<div
style="
background:white;
width:90%;
max-width:1000px;
max-height:90vh;
overflow:auto;
padding:20px;
border-radius:10px;
position:relative;
"
>

<button
onclick="closeHorseModal()"
style="
position:absolute;
right:15px;
top:15px;
font-size:20px;
"
>
✖
</button>

<h2>정보</h2>

<div id="horse-body"></div>

</div>

</div>

<div id="custom-modal" class="modal-overlay">

    <div class="modal-box">

        <div
        id="modal-icon"
        class="modal-icon"
        >
        🧬
        </div>

        <div
        id="modal-title"
        class="modal-title"
        >
        제목
        </div>

        <div
        id="modal-message"
        class="modal-message"
        >
        내용
        </div>

        <div class="modal-buttons">

            <button
            class="modal-cancel"
            onclick="closeModal(false)"
            >
            취소
            </button>

            <button
            class="modal-confirm"
            onclick="closeModal(true)"
            >
            확인
            </button>

        </div>

    </div>

</div>

<!-- 맨 위로 -->
<div class="floating-nav">

    <button
    class="float-btn"
    onclick="scrollTopSmooth()"
    >
    ⬆
    </button>

</div>


<!-- 목차 -->
<div class="floating-menu">

    <div
    id="floatingList"
    class="floating-list"
    >

        <div
        class="floating-item"
        onclick="goSection('top5')"
        >
        🏆 AI 추천 TOP5
        </div>

        <div
        class="floating-item"
        onclick="goSection('score')"
        >
        📊 1. 기본능력 점수
        </div>

        <div
        class="floating-item"
        onclick="goSection('age')"
        >
        🎂 2. 연령 분포
        </div>

        <div
        class="floating-item"
        onclick="goSection('gender')"
        >
        ⚥ 3. 성별 분포
        </div>

        <div
        class="floating-item"
        onclick="goSection('record')"
        >
        🏇 4. 통산 전적
        </div>

        <div
        class="floating-item"
        onclick="goSection('rating')"
        >
        ⭐ 5. 레이팅 비교
        </div>

        <div
        class="floating-item"
        onclick="goSection('jockey')"
        >
        🏇 6. 기수·조교사 승률
        </div>

        <div
        class="floating-item"
        onclick="goSection('training')"
        >
        📅 7. 출전주기·조교횟수
        </div>

        <div
        class="floating-item"
        onclick="goSection('swim')"
        >
        🏊 8.평균훈련량·수영훈련
        </div>

        <div
        class="floating-item"
        onclick="goSection('comment')"
        >
        💬 9. AI 코멘트
        </div>

    </div>

    <button
    class="floating-btn"
    onclick="toggleFloatingMenu()"
    >
    ≡
    </button>

</div>

<script src="/js/basic-report.js"></script>
</body>
</html>
